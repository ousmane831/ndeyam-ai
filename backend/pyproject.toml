[project]
name = "ndeyam-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106"]
"conftest.py" = ["S105", "S106"]
"scripts/*" = ["S608"]
