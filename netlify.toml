# NDEYAM AI — interface sur Netlify. L'API est sur Render : son adresse est donnée par la variable
# VITE_API_BASE_URL (tableau de bord Netlify), ex. https://ndeyam-api.onrender.com/api/v1
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Application d'une seule page : toutes les adresses (/animaux, /formulation/12…) servent index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker et le manifeste doivent toujours être relus (mises à jour du mode hors ligne).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
# Fichiers compilés : leur nom change à chaque version, ils peuvent être gardés longtemps.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
