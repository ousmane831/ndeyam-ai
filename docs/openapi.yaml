openapi: 3.0.3
info:
  title: NDEYAM AI — API
  version: 0.1.0
  description: API REST de la plateforme NDEYAM AI (prototype). Les résultats du moteur
    de formulation sont des estimations mathématiques et non des recommandations validées,
    sauf mention explicite.
paths:
  /api/v1/activity-logs/:
    get:
      operationId: v1_activity_logs_list
      description: Journal d'activité de la plateforme (administrateurs).
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: farm
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: v1_admin_users_list
      description: 'Gestion des utilisateurs par les administrateurs. Pas de suppression
        : les comptes sont désactivés.'
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          title: Rôle
          enum:
          - ADMIN
          - ELEVEUR
          - EXPERT
        description: |-
          * `ADMIN` - Administrateur
          * `ELEVEUR` - Éleveur
          * `EXPERT` - Expert
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: v1_admin_users_create
      description: 'Gestion des utilisateurs par les administrateurs. Pas de suppression
        : les comptes sont désactivés.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: v1_admin_users_retrieve
      description: 'Gestion des utilisateurs par les administrateurs. Pas de suppression
        : les comptes sont désactivés.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this utilisateur.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: v1_admin_users_partial_update
      description: 'Gestion des utilisateurs par les administrateurs. Pas de suppression
        : les comptes sont désactivés.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this utilisateur.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/alert-rules/:
    get:
      operationId: v1_alert_rules_list
      description: |-
        Réglages des alertes. Règles d'exploitation : propriétaire / gestionnaire.
        Règles par défaut de la plateforme (sans exploitation) : administrateurs.
      parameters:
      - in: query
        name: alert_type
        schema:
          type: string
          title: Type
          enum:
          - FOLLOW_UP_REMINDER
          - FORMULA_TO_REVIEW
          - GROWTH_OUT_OF_RANGE
          - MISSING_DATA
          - REFERENCE_TO_VALIDATE
          - WEIGHING_REMINDER
        description: |-
          * `WEIGHING_REMINDER` - Rappel de pesée
          * `FOLLOW_UP_REMINDER` - Rappel de suivi
          * `MISSING_DATA` - Information manquante
          * `REFERENCE_TO_VALIDATE` - Donnée de référence à valider
          * `FORMULA_TO_REVIEW` - Formulation à vérifier
          * `GROWTH_OUT_OF_RANGE` - Croissance hors plage de suivi
      - in: query
        name: farm
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
          description: ''
    post:
      operationId: v1_alert_rules_create
      description: |-
        Réglages des alertes. Règles d'exploitation : propriétaire / gestionnaire.
        Règles par défaut de la plateforme (sans exploitation) : administrateurs.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
  /api/v1/alert-rules/{id}/:
    get:
      operationId: v1_alert_rules_retrieve
      description: |-
        Réglages des alertes. Règles d'exploitation : propriétaire / gestionnaire.
        Règles par défaut de la plateforme (sans exploitation) : administrateurs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this règle d'alerte.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
