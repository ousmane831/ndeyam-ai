  /api/v1/formulas/:
    get:
      operationId: v1_formulas_list
      description: |-
        Formules de l'exploitation. Cette étape gère les formules SAISIES MANUELLEMENT (champ `manual_items`) ;
        les formules calculées par le moteur d'optimisation arrivent à l'étape 6.
      parameters:
      - in: query
        name: animal
        schema:
          type: integer
      - in: query
        name: group
        schema:
          type: integer
      - in: query
        name: is_demo
        schema:
          type: boolean
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - BALANCED
          - ECONOMIC
          - MANUAL
        description: |-
          * `ECONOMIC` - Économique (coût minimal)
          * `BALANCED` - Équilibré (objectifs nutritionnels)
          * `MANUAL` - Saisie manuelle
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: species
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          title: Statut
          enum:
          - DRAFT
          - ESTIMATED
          - INFEASIBLE
          - PENDING_REVIEW
          - REFUSED
          - REJECTED
          - VALIDATED
        description: |-
          * `DRAFT` - Brouillon
          * `REFUSED` - Calcul refusé (données insuffisantes)
          * `INFEASIBLE` - Aucune solution (contraintes incompatibles)
          * `ESTIMATED` - Estimation mathématique
          * `PENDING_REVIEW` - En attente de vérification
          * `VALIDATED` - Validée par un expert
          * `REJECTED` - Rejetée par un expert
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeedFormulaList'
          description: ''
    post:
      operationId: v1_formulas_create
      description: |-
        Formules de l'exploitation. Cette étape gère les formules SAISIES MANUELLEMENT (champ `manual_items`) ;
        les formules calculées par le moteur d'optimisation arrivent à l'étape 6.
      tags:
      - v1
