        schema:
          type: integer
        description: A unique integer value identifying this règle d'alerte.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
    patch:
      operationId: v1_alert_rules_partial_update
      description: |-
        Réglages des alertes. Règles d'exploitation : propriétaire / gestionnaire.
        Règles par défaut de la plateforme (sans exploitation) : administrateurs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this règle d'alerte.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlertRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlertRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlertRuleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
          description: ''
    delete:
      operationId: v1_alert_rules_destroy
      description: |-
        Réglages des alertes. Règles d'exploitation : propriétaire / gestionnaire.
        Règles par défaut de la plateforme (sans exploitation) : administrateurs.
      parameters:
      - in: path
        name: id
