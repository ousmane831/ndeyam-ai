  /api/v1/alerts/:
    get:
      operationId: v1_alerts_list
      description: |-
        Alertes visibles par l'utilisateur : celles de ses exploitations et celles qui lui sont adressées.
        Par défaut, seules les alertes ouvertes ou prises en compte sont listées (`?status=` pour les autres).
      parameters:
      - in: query
        name: alert_type
        schema:
          type: string
          title: Type
          enum:
          - FOLLOW_UP_REMINDER
          - FORMULA_TO_REVIEW
          - GROWTH_OUT_OF_RANGE
          - MISSING_DATA
          - REFERENCE_TO_VALIDATE
          - WEIGHING_REMINDER
        description: |-
          * `WEIGHING_REMINDER` - Rappel de pesée
          * `FOLLOW_UP_REMINDER` - Rappel de suivi
          * `MISSING_DATA` - Information manquante
          * `REFERENCE_TO_VALIDATE` - Donnée de référence à valider
          * `FORMULA_TO_REVIEW` - Formulation à vérifier
          * `GROWTH_OUT_OF_RANGE` - Croissance hors plage de suivi
      - in: query
        name: farm
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          title: Niveau
          enum:
          - CRITICAL
          - INFO
          - WARNING
        description: |-
          * `INFO` - Information
          * `WARNING` - Attention
          * `CRITICAL` - Important
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACKNOWLEDGED
          - DISMISSED
          - OPEN
          - RESOLVED
        description: |-
          * `OPEN` - Ouverte
          * `ACKNOWLEDGED` - Prise en compte
          * `RESOLVED` - Résolue
          * `DISMISSED` - Ignorée
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: string
        description: Les valeurs multiples doivent être séparées par des virgules.
        explode: false
        style: form
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertList'
          description: ''
  /api/v1/alerts/{id}/:
    get:
      operationId: v1_alerts_retrieve
      description: |-
