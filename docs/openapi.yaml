components:
  schemas:
    ActionEnum:
      enum:
      - SUBMITTED
      - VALIDATED
      - REJECTED
      - REVERTED
      type: string
      description: |-
        * `SUBMITTED` - Soumis à validation
        * `VALIDATED` - Validé
        * `REJECTED` - Rejeté
        * `REVERTED` - Remis en brouillon
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 64
        action_label:
          type: string
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        farm:
          type: integer
          nullable: true
          title: Exploitation
        farm_name:
          type: string
          readOnly: true
        object_repr:
          type: string
          title: Objet
          maxLength: 255
        details:
          title: Détails
        ip_address:
          type: string
          nullable: true
          title: Adresse IP
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Date
      required:
      - action
      - action_label
      - actor_email
      - created_at
      - farm_name
      - id
    AdminUser:
      type: object
      description: Gestion des comptes par un administrateur (création d'experts,
        changement de rôle, désactivation).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Adresse e-mail
          maxLength: 254
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        phone:
          type: string
          title: Téléphone
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          title: Rôle
        role_label:
          type: string
          readOnly: true
        is_active:
          type: boolean
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        farms_count:
          type: integer
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Date d’inscription
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Dernière connexion
      required:
      - date_joined
      - email
      - farms_count
      - id
      - last_login
      - role_label
    AdminUserRequest:
      type: object
      description: Gestion des comptes par un administrateur (création d'experts,
        changement de rôle, désactivation).
      properties:
        email:
          type: string
          format: email
          minLength: 1
          title: Adresse e-mail
          maxLength: 254
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        phone:
          type: string
          title: Téléphone
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          title: Rôle
        is_active:
          type: boolean
          title: Actif
          description: Précise si l’utilisateur doit être considéré comme actif. Décochez
            ceci plutôt que de supprimer le compte.
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        farm:
          type: integer
          readOnly: true
          nullable: true
        farm_name:
          type: string
          readOnly: true
        alert_type:
          allOf:
          - $ref: '#/components/schemas/AlertTypeEnum'
          readOnly: true
          title: Type
        alert_type_label:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
          title: Niveau
        severity_label:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
          title: Titre
        message:
          type: string
          readOnly: true
        rule_code:
          type: string
          readOnly: true
          title: Code de la règle
        rule_name:
          type: string
          readOnly: true
        trigger_data:
          readOnly: true
          title: Valeurs déclenchantes
        target:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AlertStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          title: Échéance
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_by_email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Créé le
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Modifié le
      required:
      - alert_type
      - alert_type_label
      - created_at
      - due_date
      - farm
      - farm_name
      - id
      - message
      - resolved_at
      - resolved_by_email
      - rule_code
      - rule_name
      - severity
      - severity_label
      - status
      - status_label
      - target
      - title
      - trigger_data
      - updated_at
    AlertActionRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
    AlertRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        farm:
          type: integer
          nullable: true
        scope:
          type: string
          readOnly: true
        alert_type:
          allOf:
          - $ref: '#/components/schemas/AlertTypeEnum'
          title: Type
        alert_type_label:
          type: string
          readOnly: true
        name:
          type: string
          title: Nom
          maxLength: 200
        description:
          type: string
        parameters:
          title: Paramètres
        is_active:
          type: boolean
          title: Active
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Créé le
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Modifié le
      required:
      - alert_type
      - alert_type_label
      - created_at
      - id
      - scope
      - updated_at
    AlertRuleRequest:
      type: object
      properties:
        farm:
          type: integer
          nullable: true
        alert_type:
          allOf:
          - $ref: '#/components/schemas/AlertTypeEnum'
          title: Type
        name:
          type: string
          minLength: 1
          title: Nom
          maxLength: 200
        description:
          type: string
        parameters:
          title: Paramètres
        is_active:
          type: boolean
          title: Active
      required:
      - alert_type
    AlertStatusEnum:
      enum:
      - OPEN
      - ACKNOWLEDGED
