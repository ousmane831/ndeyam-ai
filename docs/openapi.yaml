  /api/v1/animals/:
    get:
      operationId: v1_animals_list
      description: |-
        Ressource rattachée à une exploitation (champ `farm`, direct ou via `farm_lookup`).

        - Liste / détail : uniquement les exploitations dont l'utilisateur est membre (sinon 404).
        - Création : exploitation où l'utilisateur peut écrire (propriétaire / gestionnaire).
        - Modification / suppression : idem ; un expert invité reste en lecture seule (403).
        - L'exploitation d'un objet ne peut pas être changée après création.
      parameters:
      - in: query
        name: breed
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: group
        schema:
          type: integer
      - in: query
        name: group__isnull
        schema:
          type: boolean
      - in: query
        name: is_demo
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: physiological_stage
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sex
        schema:
          type: string
          title: Sexe
          enum:
          - F
          - M
        description: |-
          * `M` - Mâle
          * `F` - Femelle
      - in: query
        name: species
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          title: Statut
          enum:
          - ACTIVE
          - ARCHIVED
          - DEAD
          - SOLD
        description: |-
          * `ACTIVE` - Présent
          * `SOLD` - Vendu
          * `DEAD` - Mort
          * `ARCHIVED` - Archivé
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: string
        description: Les valeurs multiples doivent être séparées par des virgules.
        explode: false
        style: form
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnimalList'
          description: ''
    post:
      operationId: v1_animals_create
      description: |-
        Ressource rattachée à une exploitation (champ `farm`, direct ou via `farm_lookup`).

        - Liste / détail : uniquement les exploitations dont l'utilisateur est membre (sinon 404).
        - Création : exploitation où l'utilisateur peut écrire (propriétaire / gestionnaire).
        - Modification / suppression : idem ; un expert invité reste en lecture seule (403).
        - L'exploitation d'un objet ne peut pas être changée après création.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnimalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnimalRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
          description: ''
  /api/v1/animals/{animal_pk}/observations/:
    get:
      operationId: v1_animals_observations_list
      description: Observations d'un animal (route imbriquée /animals/{id}/observations/).
      parameters:
      - in: path
        name: animal_pk
        schema:
          type: integer
        required: true
      - name: ordering
        required: false
        in: query
